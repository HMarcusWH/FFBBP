name: Abstract mathematics checks

on:
  push:
    branches: [main]
    paths:
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'FFBBP.lean'
      - 'FFBBP/**'
      - 'examples/abstract_counterexamples.py'
      - '.github/workflows/mathematics.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: Exact arithmetic examples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run fixed examples
        run: |
          python3 --version
          python3 examples/abstract_counterexamples.py

  lean:
    name: Lean bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Elan and selected toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/3cc76985a1becb3c03cd65c1c5007e6f186ae474/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - name: Resolve initial dependency manifest
        run: |
          if [ ! -f lake-manifest.json ]; then
            lake update
          fi
          test -s lake-manifest.json
      - name: Obtain Mathlib cache for smoke-test imports
        run: lake exe cache get Mathlib.Data.Nat.Basic
      - name: Build mathematical library
        run: |
          set -o pipefail
          lake build FFBBP 2>&1 | tee lean-build.log
      - name: Check thirty-six named declarations and their axiom reports
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true FFBBP.lean 2>&1 | tee lean-smoke.log
          audit_failed=0
          for declaration in \
            FFBBP.bootstrapSmoke \
            FFBBP.AbstractExamples.m04_noReducedMap \
            FFBBP.AbstractExamples.m08_overlapCounts \
            FFBBP.AbstractExamples.m14_parityLoss \
            FFBBP.AbstractExamples.m16_aggregateAmbiguity \
            FFBBP.AbstractExamples.m02_prefixCounts \
            FFBBP.AbstractExamples.m05_equalMeanCounts \
            FFBBP.AbstractExamples.m16_centeredSums \
            FFBBP.AbstractExamples.m03_coinParityCounts \
            FFBBP.AbstractExamples.m04_binaryMarginalCounts \
            FFBBP.AbstractExamples.m06_mixtureCounts \
            FFBBP.AbstractExamples.m16_swapCounts \
            FFBBP.AbstractExamples.m09_observationalAgreement \
            FFBBP.AbstractExamples.m09_worstCaseError \
            FFBBP.AbstractExamples.m05_conditioningAmplification \
            FFBBP.AbstractExamples.m11_bernoulliSeparation \
            FFBBP.AbstractExamples.m05_horizonGapCounts \
            FFBBP.AbstractExamples.m07_balancedLikelihoodCounts \
            FFBBP.AbstractExamples.m13_parityIdentifiedGrid \
            FFBBP.AbstractExamples.m13_endpointIdentifiedSet \
            FFBBP.AbstractExamples.m15_samplingVarianceCounts \
            FFBBP.StructuralFoundations.m01_observationLawFactorization \
            FFBBP.StructuralFoundations.m03_orbitQuotientMap \
            FFBBP.StructuralFoundations.m08_logicalAlternatives \
            FFBBP.StructuralFoundations.m13_identifiedSetCharacterization \
            FFBBP.StructuralFoundations.m14_coarseningInclusion \
            FFBBP.FiniteProbability.m01_priorOddsCounts \
            FFBBP.FiniteProbability.m01_squaredRiskLowerBound \
            FFBBP.FiniteProbability.m06_totalVarianceNumerators \
            FFBBP.FiniteProbability.m08_intersectionBounds \
            FFBBP.FiniteProbability.m10_midpointSharpness \
            FFBBP.FiniteProbability.m14_finiteTVContraction \
            FFBBP.PrefixLaws.m02_prefixMarginalization \
            FFBBP.PrefixLaws.m02_cylinderDynkinUniqueness \
            FFBBP.PrefixLaws.m02_conditionalLawAgreement \
            FFBBP.MetricExamples.m05_diracMetricSeparation
          do
            if ! grep -Fx "'$declaration' does not depend on any axioms" lean-smoke.log; then
              echo "::error::Missing exact axiom-free report for $declaration"
              audit_failed=1
            fi
          done
          exit "$audit_failed"
      - name: Retain generated manifest and compiler output
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-bootstrap-evidence
          path: |
            lake-manifest.json
            lean-smoke.log
            lean-build.log
          if-no-files-found: error
          retention-days: 30
